name: wardsense
description: "WardSense - Trend-Based Early Sepsis Deterioration Assistant for General Hospital Wards"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local Storage (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  fl_chart: ^0.66.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.2
  equatable: ^2.0.5
  collection: ^1.18.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
